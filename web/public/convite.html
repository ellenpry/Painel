<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Aceitar convite · Painel de Atendimento</title>
  <link rel="stylesheet" href="/css/estilo.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body data-pagina="convite">
<main class="acesso">
  <div class="cartao-acesso">
    <div class="marca"><div class="logo" aria-hidden="true">P</div><span>Painel de Atendimento</span></div>
    <h1>Bem-vindo(a)!</h1>
    <p class="mudo" id="sub">Conferindo o convite…</p>
    <div id="alerta" hidden></div>
    <form id="form" novalidate hidden>
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" readonly>
      <label for="nome">Seu nome</label>
      <input id="nome" autocomplete="name" required>
      <label for="senha">Crie uma senha</label>
      <input id="senha" type="password" autocomplete="new-password" minlength="8" required>
      <label for="confirmacao">Repita a senha</label>
      <input id="confirmacao" type="password" autocomplete="new-password" minlength="8" required>
      <p class="mudo pequeno">Mínimo de 8 caracteres.</p>
      <button type="submit" class="primario">Criar conta e entrar</button>
    </form>
    <div class="rodape"><a href="/login">Já tenho conta</a></div>
  </div>
</main>
<script src="/js/comum.js"></script>
<script src="/js/acesso.js"></script>
</body>
</html>
