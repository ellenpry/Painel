<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Aceitar convite · Libera</title>
  <link rel="stylesheet" href="/css/estilo.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <meta name="theme-color" content="#1d5e94">
  <script src="/js/tema.js"></script>
</head>
<body data-pagina="convite">
<main class="acesso">
  <div class="cartao-acesso">
    <div class="logo-acesso" role="img" aria-label="Libera · Painel de Atendimento">
      <img class="simbolo so-claro" src="/img/libera-simbolo.svg" alt="" width="44" height="44">
      <img class="simbolo so-escuro" src="/img/libera-simbolo-escuro.svg" alt="" width="44" height="44">
      <div><div class="nome">Libera</div><div class="assinatura">Painel de Atendimento</div></div>
    </div>
    <h1>Bem-vindo(a)!</h1>
    <p class="mudo" id="sub">Conferindo o convite…</p>
    <div id="alerta" hidden></div>
    <form id="form" novalidate hidden>
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" readonly>
      <label for="nome">Seu nome</label>
      <input id="nome" autocomplete="name" required>
      <label for="senha">Crie uma senha</label>
      <input id="senha" type="password" autocomplete="new-password" minlength="8" required>
      <label for="confirmacao">Repita a senha</label>
      <input id="confirmacao" type="password" autocomplete="new-password" minlength="8" required>
      <p class="mudo pequeno">Mínimo de 8 caracteres.</p>
      <button type="submit" class="primario">Criar conta e entrar</button>
    </form>
    <div class="rodape"><a href="/login">Já tenho conta</a></div>
  </div>
</main>
<script src="/js/comum.js"></script>
<script src="/js/acesso.js"></script>
</body>
</html>
