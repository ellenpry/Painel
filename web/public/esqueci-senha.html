<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Esqueci minha senha · Libera</title>
  <link rel="stylesheet" href="/css/estilo.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <meta name="theme-color" content="#1d5e94">
  <script src="/js/tema.js"></script>
</head>
<body data-pagina="esqueci">
<main class="acesso">
  <div class="cartao-acesso">
    <div class="logo-acesso" role="img" aria-label="Libera · Painel de Atendimento">
      <img class="simbolo so-claro" src="/img/libera-simbolo.svg" alt="" width="44" height="44">
      <img class="simbolo so-escuro" src="/img/libera-simbolo-escuro.svg" alt="" width="44" height="44">
      <div><div class="nome">Libera</div><div class="assinatura">Painel de Atendimento</div></div>
    </div>
    <h1>Esqueci minha senha</h1>
    <p class="mudo">Informe o e-mail da sua conta. Se ele estiver cadastrado, você recebe um link para criar uma senha nova.</p>
    <div id="alerta" hidden></div>
    <form id="form" novalidate>
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" required autofocus>
      <button type="submit" class="primario">Enviar link</button>
    </form>
    <div class="rodape"><a href="/login">Voltar para o login</a></div>
  </div>
</main>
<script src="/js/comum.js"></script>
<script src="/js/acesso.js"></script>
</body>
</html>
